<!doctype html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0F1422" />
    <meta name="color-scheme" content="dark light" />
    <title>Sujay Sreedhar — AI Infrastructure Engineer</title>
    <meta name="description" content="Sujay Sreedhar is a Technical Solutions Engineer building the network fabric behind large-scale AI training. Former xAI and Tesla." />
    <meta property="og:title" content="Sujay Sreedhar — AI Infrastructure Engineer" />
    <meta property="og:description" content="Building the network fabric behind large-scale AI training. Former xAI and Tesla." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // Apply theme before paint to avoid FOUC
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var theme = saved === 'light' || saved === 'dark'
            ? saved
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'dark');
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(theme);
        } catch (e) {}
      })();
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
